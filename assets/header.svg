<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 46px 'Segoe UI', Arial, sans-serif; letter-spacing: 6px; fill: #fff; }
    .sub { font: 600 22px 'Courier New', monospace; fill: #7dd3fc; }
  </style>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <path d="M0 175 Q125 145 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 T1750 175 T2000 175 V220 H0 Z" fill="#0b1020" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0 195 Q125 165 250 195 T500 195 T750 195 T1000 195 T1250 195 T1500 195 T1750 195 T2000 195 V220 H0 Z" fill="#0b1020" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="90" text-anchor="middle" class="name" opacity="0">KHAYAL SHARIFOV
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="138" text-anchor="middle" class="sub" opacity="0">Backend Developer
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.03;0.17;0.20;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="138" text-anchor="middle" class="sub" opacity="0">Java &amp; Spring Boot
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.23;0.37;0.40;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="138" text-anchor="middle" class="sub" opacity="0">Secure REST APIs
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.43;0.57;0.60;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="138" text-anchor="middle" class="sub" opacity="0">Clean data models
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.63;0.77;0.80;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="138" text-anchor="middle" class="sub" opacity="0">Deployments that actually run
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80;0.83;0.97;1.00;1" dur="15s" repeatCount="indefinite"/>
  </text>
